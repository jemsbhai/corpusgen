name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install package and lint tools
        run: |
          python -m pip install -U pip
          pip install -e .
          pip install mypy poetry ruff

      - name: Validate lock file
        run: poetry check --lock

      - name: Ruff
        run: ruff check src/

      - name: Mypy
        run: mypy src/

  package:
    name: Wheel + real eSpeak smoke (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu
            os: ubuntu-24.04
          - name: macOS
            os: macos-15
          - name: Windows
            os: windows-2022
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install espeak-ng (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y espeak-ng

      - name: Install espeak-ng (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install espeak-ng
          ESPEAK_LIBRARY="$(brew --prefix espeak-ng)/lib/libespeak-ng.dylib"
          test -f "$ESPEAK_LIBRARY"
          echo "PHONEMIZER_ESPEAK_LIBRARY=$ESPEAK_LIBRARY" >> "$GITHUB_ENV"

      - name: Install espeak-ng (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP "espeak-ng.msi"
          Invoke-WebRequest -Uri "https://github.com/espeak-ng/espeak-ng/releases/download/1.52.0/espeak-ng.msi" -OutFile $installer
          $process = Start-Process msiexec.exe -Wait -PassThru -ArgumentList @(
            "/i",
            "`"$installer`"",
            "/qn",
            "/norestart"
          )
          if ($process.ExitCode -notin @(0, 3010)) {
            throw "espeak-ng installer exited with code $($process.ExitCode)"
          }
          $installDirectory = Join-Path $env:ProgramFiles "eSpeak NG"
          $library = Join-Path $installDirectory "libespeak-ng.dll"
          $executable = Join-Path $installDirectory "espeak-ng.exe"
          if (-not (Test-Path $library) -or -not (Test-Path $executable)) {
            throw "espeak-ng was not installed at the expected location: $installDirectory"
          }
          $installDirectory | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "PHONEMIZER_ESPEAK_LIBRARY=$library" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & $executable --version

      - name: Build wheel
        run: |
          python -m pip install -U pip build
          python -m build --wheel

      - name: Smoke-test installed wheel
        run: |
          python -c "import glob, subprocess, sys; wheels = glob.glob('dist/*.whl'); assert len(wheels) == 1, wheels; subprocess.check_call([sys.executable, '-m', 'pip', 'install', '--force-reinstall', wheels[0]])"
          python -m pip check
          python -c "import os, tempfile; os.chdir(tempfile.gettempdir()); from importlib.resources import files; import corpusgen; assert 'site-packages' in str(corpusgen.__file__); assert files('corpusgen.data').joinpath('espeak_iso_mapping.json').is_file(); print(corpusgen.__version__)"
          espeak-ng --version
          corpusgen --help
          python -c "from corpusgen.g2p import G2PManager; result = G2PManager().phonemize('hello', language='en-us'); assert result.phonemes; assert result.ipa; print(f'G2P smoke OK: {len(result.phonemes)} phonemes')"

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install espeak-ng
        run: sudo apt-get update && sudo apt-get install -y espeak-ng

      - name: Install package and test deps
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[optimization]" pytest pytest-cov

      - name: Download pinned PHOIBLE data
        run: |
          python - <<'PY'
          import time

          from corpusgen.inventory import PhoibleDataset

          dataset = PhoibleDataset()
          for attempt in range(3):
              try:
                  dataset.download()
                  break
              except OSError:
                  if attempt == 2:
                      raise
                  time.sleep(2**attempt)
          PY

      - name: Test with coverage
        run: pytest tests/ -v --tb=short -m "not slow" --cov=corpusgen --cov-report=term-missing
