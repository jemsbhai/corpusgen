[project]
name = "corpusgen"
version = "0.1.7"
description = "Language-agnostic framework for generating and evaluating speech corpora with maximal phoneme coverage"
# poetry-core 2.3 serializes only the first PEP 621 author entry to Core
# Metadata. Keep one no-comma display string so PyPI preserves every creator;
# CITATION.cff contains the structured author and ORCID records.
authors = [{name = "Muntaser Syed and Marius Silaghi and Sheikh Abujar and Sharun Akter Khushbu and Fariha Tasmin Jaigirdar"}]
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.10,<3.14"
keywords = [
    "speech-corpus",
    "phoneme-coverage",
    "tts",
    "asr",
    "corpus-generation",
    "phonetics",
    "ipa",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "phonemizer>=3.3",
    "numpy>=1.24",
    "click>=8.1",
]

[project.urls]
Homepage = "https://github.com/jemsbhai/corpusgen"
Documentation = "https://jemsbhai.github.io/corpusgen/"
Repository = "https://github.com/jemsbhai/corpusgen"
Changelog = "https://github.com/jemsbhai/corpusgen/blob/main/CHANGELOG.md"
Issues = "https://github.com/jemsbhai/corpusgen/issues"

[project.scripts]
corpusgen = "corpusgen.cli:main"

[project.optional-dependencies]
llm = ["litellm>=1.40", "openai>=1.12", "anthropic>=0.25"]
local = ["torch>=2.1", "transformers>=4.38", "bitsandbytes>=0.43", "peft>=0.10"]
repository = ["datasets>=2.18", "huggingface-hub>=0.20"]
optimization = ["pulp>=2.7", "pymoo>=0.6"]
eval = ["matplotlib>=3.8"]
full = [
    "litellm>=1.40", "openai>=1.12", "anthropic>=0.25",
    "torch>=2.1", "transformers>=4.38", "bitsandbytes>=0.43", "peft>=0.10",
    "datasets>=2.18", "huggingface-hub>=0.20",
    "matplotlib>=3.8",
    "pulp>=2.7", "pymoo>=0.6",
]

[tool.poetry]
packages = [{include = "corpusgen", from = "src"}]

# --- Optional dependency groups ---
[tool.poetry.group.dev.dependencies]
pytest = ">=8.0"
pytest-cov = ">=5.0"
ruff = ">=0.4"
mypy = ">=1.9"
pre-commit = ">=3.7"

[tool.poetry.group.repository]
optional = true
[tool.poetry.group.repository.dependencies]
datasets = ">=2.18"
huggingface-hub = ">=0.20"

[tool.poetry.group.llm]
optional = true
[tool.poetry.group.llm.dependencies]
litellm = ">=1.40"
openai = ">=1.12"
anthropic = ">=0.25"

[tool.poetry.group.local]
optional = true
[tool.poetry.group.local.dependencies]
torch = ">=2.1"
transformers = ">=4.38"
bitsandbytes = ">=0.43"
peft = ">=0.10"

[tool.poetry.group.eval]
optional = true
[tool.poetry.group.eval.dependencies]
matplotlib = ">=3.8"

[tool.poetry.group.optimization]
optional = true
[tool.poetry.group.optimization.dependencies]
pulp = ">=2.7"
pymoo = ">=0.6"

[tool.poetry.group.full]
optional = true
[tool.poetry.group.full.dependencies]
datasets = ">=2.18"
huggingface-hub = ">=0.20"
litellm = ">=1.40"
openai = ">=1.12"
anthropic = ">=0.25"
torch = ">=2.1"
transformers = ">=4.38"
bitsandbytes = ">=0.43"
peft = ">=0.10"
matplotlib = ">=3.8"
pulp = ">=2.7"
pymoo = ">=0.6"

# --- Build system ---
[build-system]
requires = ["poetry-core==2.3.1"]
build-backend = "poetry.core.masonry.api"

# --- Tool configs ---
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short -m 'not slow'"
markers = [
    "slow: marks tests that require real models / GPU / long runtime (deselected by default, run with: -m slow)",
]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]
ignore = [
    "B905",   # zip-without-explicit-strict
    "E501",   # line-too-long (handled by formatter)
    "SIM108", # if-else-block-instead-of-if-exp
    "F841",   # unused-variable
    "N806",   # non-lowercase-variable-in-function
    "N803",   # invalid-argument-name
    "N812",   # lowercase-imported-as-non-lowercase
    "B904",   # raise-without-from-inside-except
    "B007",   # unused-loop-control-variable
    "SIM102", # collapsible-if
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    "datasets.*",
    "peft.*",
    "phonemizer.*",
    "litellm.*",
    "pulp.*",
    "pymoo.*",
    "torch.*",
    "transformers.*",
]
ignore_missing_imports = true
